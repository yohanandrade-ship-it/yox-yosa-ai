<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOX YOSA - Inteligência Artificial</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --border-color: #30363d;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --accent-hover: #1f6feb;
            --user-msg: #238636;
            --ai-msg: #21262d;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: var(--panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 1.25rem;
            color: var(--accent-color);
            letter-spacing: 1px;
        }
        .api-container {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .api-container input {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            width: 240px;
        }
        .api-container button {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .api-container button:hover {
            background-color: var(--accent-hover);
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }
        .message {
            padding: 12px 16px;
            border-radius: 8px;
            max-width: 80%;
            line-height: 1.5;
            word-break: break-word;
            white-space: pre-wrap;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.user {
            background-color: var(--user-msg);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .message.ai {
            background-color: var(--ai-msg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .input-container {
            background-color: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            padding: 15px;
            display: flex;
            justify-content: center;
        }
        .input-wrapper {
            display: flex;
            max-width: 900px;
            width: 100%;
            gap: 10px;
        }
        .input-wrapper textarea {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 8px;
            resize: none;
            height: 50px;
            max-height: 150px;
            font-size: 1rem;
            outline: none;
        }
        .input-wrapper textarea:focus {
            border-color: var(--accent-color);
        }
        .input-wrapper button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .input-wrapper button:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

    <header>
        <h1>YOX YOSA AI</h1>
        <div class="api-container">
            <input type="password" id="apiKeyInput" placeholder="Chave da API (sk_...)" />
            <button id="saveKeyBtn">Salvar Chave</button>
        </div>
    </header>

    <div id="chat-container">
        <div class="message ai">
            Olá! Eu sou a <strong>YOX YOSA</strong>, uma inteligência artificial autônoma e exclusiva. Como posso ajudar você hoje?
        </div>
    </div>

    <div class="input-container">
        <div class="input-wrapper">
            <textarea id="userInput" placeholder="Digite sua mensagem para a YOX YOSA... (Pressione Enter para enviar)"></textarea>
            <button id="sendBtn">Enviar</button>
        </div>
    </div>

    <!-- Script separado -->
    <script src="script.js"></script>
</body>
</html>
