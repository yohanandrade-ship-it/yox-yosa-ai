<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>YOX YOSA</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    .pb-safe {
      padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
    }
    .typing-cursor::after {
      content: '▋';
      animation: blink 1s infinite;
      margin-left: 2px;
      color: #94a3b8;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.2);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.4);
    }
  </style>
</head>
<body class="bg-zinc-100 dark:bg-zinc-950 text-zinc-800 dark:text-zinc-100 font-sans antialiased h-dvh w-screen overflow-hidden flex flex-col">

  <div class="flex h-full w-full overflow-hidden relative">

    <!-- OVERLAY MOBILE -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/60 z-30 hidden transition-opacity lg:hidden"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 z-40 w-72 bg-zinc-50 dark:bg-zinc-900 border-r border-zinc-200 dark:border-zinc-800 flex flex-col transition-transform duration-300 transform -translate-x-full lg:translate-x-0 h-full">

      <div class="p-3 border-b border-zinc-200 dark:border-zinc-800 flex items-center justify-between gap-2">
        <button onclick="createNewChat()" class="flex-1 flex items-center justify-between px-3 py-2.5 rounded-xl border border-zinc-300 dark:border-zinc-700 hover:bg-zinc-200/60 dark:hover:bg-zinc-800 transition text-sm font-medium">
          <span class="flex items-center gap-2">
            <i class="fa-solid fa-plus text-xs"></i>
            <span>Nova Conversa</span>
          </span>
          <i class="fa-regular fa-pen-to-square text-xs text-zinc-400"></i>
        </button>
        <button onclick="toggleSidebar()" class="lg:hidden p-2.5 text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-200">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- HISTÓRICO -->
      <div class="flex-1 overflow-y-auto p-3 space-y-4" id="chat-history-container"></div>

      <!-- PERFIL & BRAND -->
      <div class="p-3 border-t border-zinc-200 dark:border-zinc-800 flex items-center justify-between text-xs text-zinc-500">
        <div class="flex items-center gap-2 font-display font-semibold text-zinc-700 dark:text-zinc-300">
          <div class="w-6 h-6 rounded-full bg-zinc-800 dark:bg-zinc-100 text-white dark:text-zinc-900 flex items-center justify-center font-bold text-xs">Y</div>
          <span>YOX YOSA</span>
        </div>
        <button onclick="openSettingsModal()" class="p-2 hover:bg-zinc-200 dark:hover:bg-zinc-800 rounded-lg transition text-zinc-500 hover:text-zinc-800 dark:hover:text-zinc-200">
          <i class="fa-solid fa-gear text-sm"></i>
        </button>
      </div>
    </aside>

    <!-- ÁREA PRINCIPAL -->
    <main class="flex-1 flex flex-col h-full min-w-0 bg-white dark:bg-zinc-950 relative">

      <!-- HEADER -->
      <header class="h-14 border-b border-zinc-200 dark:border-zinc-800 px-4 flex items-center justify-between shrink-0 bg-white/80 dark:bg-zinc-950/80 backdrop-blur">
        <div class="flex items-center gap-3">
          <button onclick="toggleSidebar()" class="p-2 text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 rounded-lg transition" title="Menu">
            <i class="fa-solid fa-bars-staggered"></i>
          </button>
          <h1 id="current-chat-title" class="font-display font-semibold text-sm sm:text-base text-zinc-800 dark:text-zinc-100 truncate max-w-[200px] sm:max-w-md">
            Nova Conversa
          </h1>
        </div>

        <div class="flex items-center gap-1.5">
          <button onclick="toggleTheme()" class="p-2 text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 rounded-lg transition" title="Alternar Tema">
            <i class="fa-solid fa-sun hidden dark:inline text-amber-400"></i>
            <i class="fa-solid fa-moon inline dark:hidden text-zinc-600"></i>
          </button>
          <button onclick="openSettingsModal()" class="p-2 text-zinc-600 dark:text-zinc-300 hover:bg-zinc-100 dark:hover:bg-zinc-800 rounded-lg transition" title="Configurações">
            <i class="fa-solid fa-sliders"></i>
          </button>
        </div>
      </header>

      <!-- CHAT MESSAGES -->
      <section id="chat-messages" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6 flex flex-col">

        <!-- BOAS VINDAS -->
        <div id="welcome-screen" class="my-auto flex flex-col items-center justify-center text-center px-4 py-12 select-none">
          <h2 class="font-display text-2xl sm:text-4xl font-bold tracking-tight text-zinc-800 dark:text-zinc-100 mb-2">
            Bem-vindo ao YOX YOSA
          </h2>
          <p class="text-sm sm:text-base text-zinc-500 dark:text-zinc-400 max-w-sm">
            Como posso ajudar você hoje?
          </p>
        </div>

        <!-- LISTA DE MENSAGENS -->
        <div id="messages-list" class="w-full max-w-3xl mx-auto space-y-6 hidden"></div>
      </section>

      <!-- BARRA DE MENSAGEM FIXA NO RODAPÉ -->
      <footer class="w-full border-t border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-950 p-3 sm:p-4 pb-safe shrink-0">
        <div class="max-w-3xl mx-auto relative">

          <form id="chat-form" onsubmit="handleSendMessage(event)" class="relative flex items-center bg-zinc-100 dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl p-2 focus-within:border-zinc-400 dark:focus-within:border-zinc-700 transition shadow-sm">

            <button type="button" onclick="triggerFileInput()" class="p-2.5 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 transition rounded-xl" title="Anexar arquivo">
              <i class="fa-solid fa-paperclip text-base"></i>
            </button>
            <input type="file" id="file-input" class="hidden" onchange="handleFileSelected(event)">

            <textarea 
              id="user-input" 
              rows="1" 
              placeholder="Escreva uma mensagem..." 
              oninput="autoResizeTextarea(this)"
              onkeydown="handleKeyDown(event)"
              class="w-full bg-transparent px-3 py-1.5 text-sm sm:text-base text-zinc-800 dark:text-zinc-100 placeholder-zinc-400 focus:outline-none resize-none max-h-32 min-h-[38px]"
            ></textarea>

            <div class="flex items-center gap-1 shrink-0">
              <button 
                type="button" 
                id="voice-btn" 
                onclick="toggleVoiceRecognition()" 
                class="p-2.5 text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 transition rounded-xl"
                title="Entrada por voz">
                <i class="fa-solid fa-microphone text-base"></i>
              </button>

              <button 
                type="submit" 
                id="send-btn" 
                class="w-9 h-9 flex items-center justify-center rounded-xl bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 font-medium hover:opacity-90 active:scale-95 transition disabled:opacity-40 disabled:pointer-events-none">
                <i class="fa-solid fa-arrow-up text-sm"></i>
              </button>
            </div>
          </form>

          <div id="status-bar" class="hidden mt-2 flex items-center justify-between text-xs text-zinc-500 px-2">
            <span id="status-text" class="flex items-center gap-1.5"></span>
            <button type="button" onclick="cancelStatus()" class="hover:underline text-zinc-400">Remover</button>
          </div>

        </div>
      </footer>

    </main>
  </div>

  <!-- MODAL CONFIGURAÇÕES -->
  <div id="settings-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden backdrop-blur-sm">
    <div class="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-2xl w-full max-w-md p-6 shadow-xl space-y-6">

      <div class="flex items-center justify-between border-b border-zinc-200 dark:border-zinc-800 pb-4">
        <h3 class="font-display font-semibold text-lg text-zinc-800 dark:text-zinc-100">Configurações</h3>
        <button onclick="closeSettingsModal()" class="text-zinc-400 hover:text-zinc-600 dark:hover:text-zinc-200 p-1">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <div class="space-y-4">

        <!-- Chave API -->
        <div>
          <label class="block font-medium text-sm text-zinc-800 dark:text-zinc-200 mb-1">Chave da API (Pollinations)</label>
          <input type="password" id="api-key-input" placeholder="Opcional: Cole sua chave aqui" class="w-full bg-zinc-100 dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 rounded-xl p-2.5 text-sm text-zinc-800 dark:text-zinc-200 focus:outline-none focus:border-zinc-500">
          <div class="text-[11px] text-zinc-500 mt-1">Se deixado em branco, usará o canal automático gratuito.</div>
        </div>

        <!-- Aparência -->
        <div class="flex items-center justify-between">
          <div>
            <div class="font-medium text-sm text-zinc-800 dark:text-zinc-200">Aparência</div>
            <div class="text-xs text-zinc-500">Escolha o tema da interface</div>
          </div>
          <select id="theme-select" onchange="changeThemeFromSelect(this.value)" class="bg-zinc-100 dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 text-sm rounded-lg p-2 text-zinc-800 dark:text-zinc-200 focus:outline-none">
            <option value="dark">Escuro</option>
            <option value="light">Claro</option>
          </select>
        </div>

        <!-- Som -->
        <div class="flex items-center justify-between">
          <div>
            <div class="font-medium text-sm text-zinc-800 dark:text-zinc-200">Efeitos Sonoros</div>
            <div class="text-xs text-zinc-500">Som sintético suave ao digitar</div>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="sound-toggle" onchange="toggleSoundSetting(this.checked)" class="sr-only peer" checked>
            <div class="w-11 h-6 bg-zinc-300 peer-focus:outline-none rounded-full peer dark:bg-zinc-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-zinc-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-zinc-800 dark:peer-checked:bg-zinc-200 dark:after:bg-zinc-900"></div>
          </label>
        </div>

        <!-- Leitura de Voz -->
        <div class="flex items-center justify-between">
          <div>
            <div class="font-medium text-sm text-zinc-800 dark:text-zinc-200">Leitura de Voz</div>
            <div class="text-xs text-zinc-500">Ler respostas automaticamente</div>
          </div>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="tts-toggle" onchange="toggleTTSSetting(this.checked)" class="sr-only peer">
            <div class="w-11 h-6 bg-zinc-300 peer-focus:outline-none rounded-full peer dark:bg-zinc-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-zinc-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-zinc-800 dark:peer-checked:bg-zinc-200 dark:after:bg-zinc-900"></div>
          </label>
        </div>

        <!-- Botões de Ação -->
        <div class="pt-4 border-t border-zinc-200 dark:border-zinc-800 space-y-2">
          <button onclick="saveApiKeySetting()" class="w-full py-2.5 px-4 bg-zinc-900 dark:bg-zinc-100 text-white dark:text-zinc-900 font-medium text-sm rounded-xl transition hover:opacity-90">
            Salvar Alterações
          </button>
          <button onclick="clearAllData()" class="w-full py-2 px-4 bg-red-500/10 hover:bg-red-500/20 text-red-600 dark:text-red-400 font-medium text-xs rounded-xl transition">
            Limpar Todo o Histórico
          </button>
        </div>

      </div>

    </div>
  </div>

  <!-- CÓDIGO JAVASCRIPT EXTERNO -->
  <script src="script.js"></script>
</body>
</html>
