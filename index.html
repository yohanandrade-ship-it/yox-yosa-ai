<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YOX YOSA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        mono: {
                            900: '#000000',
                            800: '#0a0a0a',
                            700: '#141414',
                            600: '#222222',
                            500: '#333333',
                            400: '#666666',
                            300: '#888888',
                            200: '#aaaaaa',
                            100: '#e5e5e5',
                            50: '#ffffff'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #000000;
        }
        ::-webkit-scrollbar-thumb {
            background: #333333;
            border-radius: 2px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #666666;
        }
        
        .cursor-blink {
            display: inline-block;
            width: 8px;
            height: 14px;
            background-color: #ffffff;
            margin-left: 2px;
            animation: blink 0.8s infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
    </style>
</head>
<body class="bg-mono-900 text-mono-50 font-mono antialiased h-screen w-screen overflow-hidden flex flex-col selection:bg-mono-50 selection:text-mono-900">

    <!-- HEADER TOP -->
    <header class="h-14 border-b border-mono-50/20 px-4 flex items-center justify-between bg-mono-900 shrink-0 z-20">
        <div class="flex items-center gap-3">
            <button id="toggleHistoryBtn" class="px-3 py-1.5 border border-mono-50/30 hover:border-mono-50 bg-mono-900 text-mono-50 text-xs uppercase tracking-widest transition-all active:translate-y-0.5">
                [ Histórico ]
            </button>
            <h1 class="text-xs font-bold tracking-widest uppercase text-mono-50">YOX YOSA</h1>
        </div>
        <div class="flex items-center gap-2">
            <button id="toggleConfigBtn" class="px-3 py-1.5 border border-mono-50/30 hover:border-mono-50 bg-mono-900 text-mono-50 text-xs uppercase tracking-widest transition-all active:translate-y-0.5">
                [ Config ]
            </button>
        </div>
    </header>

    <!-- MAIN BODY CONTAINER -->
    <div class="flex-1 flex relative overflow-hidden">

        <!-- SIDEBAR HISTORICO -->
        <aside id="historySidebar" class="absolute inset-y-0 left-0 w-72 bg-mono-800 border-r border-mono-50/20 transform -translate-x-full transition-transform duration-200 z-30 flex flex-col">
            <div class="p-4 border-b border-mono-50/20 flex items-center justify-between bg-mono-900">
                <span class="text-xs uppercase font-bold tracking-widest text-mono-50">Sessões</span>
                <button id="newChatBtn" class="px-3 py-1 border border-mono-50 text-mono-50 text-xs hover:bg-mono-50 hover:text-mono-900 uppercase font-bold tracking-wider transition-all">
                    + Novo
                </button>
            </div>
            <div id="historyList" class="flex-1 overflow-y-auto p-3 space-y-2 text-xs">
                <!-- Historico dinamico -->
            </div>
        </aside>

        <!-- CHAT AREA FRONTAL -->
        <main class="flex-1 flex flex-col h-full w-full max-w-4xl mx-auto relative bg-mono-900">

            <!-- EXIBICAO DE MENSAGENS FRONTAL -->
            <div id="chatMessages" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4">
                <!-- Baloes dinamicos -->
            </div>

            <!-- BARRA DE MENSAGEM -->
            <div class="p-4 border-t border-mono-50/20 bg-mono-900">
                <form id="chatForm" class="flex gap-2 items-center">
                    <input 
                        type="text" 
                        id="messageInput" 
                        placeholder="DIGITE SUA MENSAGEM AQUI..." 
                        class="flex-1 bg-mono-800 border border-mono-50/30 text-mono-50 px-4 py-3 text-xs tracking-wider outline-none focus:border-mono-50 transition-colors uppercase placeholder:text-mono-400"
                        autocomplete="off"
                    />
                    <button 
                        type="submit" 
                        id="sendBtn"
                        class="px-6 py-3 border border-mono-50 bg-mono-50 text-mono-900 font-bold text-xs uppercase tracking-widest hover:bg-mono-200 transition-colors shrink-0 active:translate-y-0.5"
                    >
                        ENVIAR
                    </button>
                </form>
            </div>

        </main>
    </div>

    <!-- CONFIG MODAL -->
    <div id="configModal" class="fixed inset-0 bg-mono-900/90 backdrop-blur-sm z-40 hidden items-center justify-center p-4">
        <div class="bg-mono-800 border border-mono-50/30 p-6 w-full max-w-md space-y-4 shadow-2xl">
            <div class="flex justify-between items-center border-b border-mono-50/20 pb-3">
                <h3 class="text-xs font-bold uppercase tracking-widest text-mono-50">CONFIGURAÇÃO DE API</h3>
                <button id="closeConfigBtn" class="text-xs text-mono-300 hover:text-mono-50 uppercase tracking-wider">[ FECHAR ]</button>
            </div>
            <div class="space-y-3">
                <p class="text-[11px] text-mono-300 uppercase leading-relaxed">
                    SUA CHAVE DE API PODE SER DEFINIDA DIRETAMENTE DENTRO DO ARQUIVO <span class="text-mono-50 font-bold">SCRIPT.JS</span> NA VARIÁVEL <span class="text-mono-50 font-bold">HARDCODED_API_KEY</span>.
                </p>
                <div class="space-y-1">
                    <label class="block text-[10px] uppercase text-mono-400">CHAVE ATUAL (SOBREPOSIÇÃO MANUAL):</label>
                    <input 
                        type="password" 
                        id="apiKeyInput" 
                        placeholder="sk_..." 
                        class="w-full bg-mono-900 border border-mono-50/30 p-3 text-xs text-mono-50 outline-none focus:border-mono-50"
                    />
                </div>
            </div>
            <div class="flex justify-end pt-2">
                <button id="saveKeyBtn" class="px-5 py-2 border border-mono-50 bg-mono-50 text-mono-900 text-xs font-bold uppercase tracking-wider hover:bg-mono-200 transition-colors">
                    SALVAR
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
